# Fixed part of the tab bar; the style (slanted, round, angled, separators)
# and the position come from the settings menu (generated/appearance.conf).
# custom = kitty's powerline tabs drawn by tab_bar.py, plus the ⚙ settings button
tab_bar_style custom
tab_bar_align left
tab_bar_margin_width 6
tab_bar_margin_height 6 4
tab_bar_min_tabs 1
tab_title_max_length 32
# Tab colors come from the theme (generated/theme.conf).
tab_title_template " {index} {title} "
active_tab_title_template " {index} {title} "
active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_show_new_tab_button yes
# The ⚙ settings button: Symbola draws a larger gear than the text
# font; it spreads over two cells (the button leaves a space after it).
symbol_map U+2699 Symbola
narrow_symbols U+2699 2
