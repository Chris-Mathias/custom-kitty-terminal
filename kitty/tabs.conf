# Tab style: "Slanted" — tabs side by side with slanted edges.
# (Other styles tried: capsule, pills, dividers, dots, gradient.
#  Pills and dots use tab_bar.py with tab_bar_style custom.)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left
tab_bar_margin_width 6
tab_bar_margin_height 6 4
tab_bar_min_tabs 1
tab_bar_background #1c1c1f
tab_title_max_length 32
tab_title_template " {index} {title} "
active_tab_title_template " {index} {title} "
active_tab_foreground   #ffffff
active_tab_background   #3c6eb4
active_tab_font_style   bold
inactive_tab_foreground #b0afb5
inactive_tab_background #2e2e32
inactive_tab_font_style normal
tab_bar_show_new_tab_button yes
