# Tab style: "Slanted" — tabs side by side with slanted edges.
# (Other styles tried: capsule, pills, dividers, dots, gradient.)
tab_bar_edge top
# custom = kitty's powerline tabs drawn by tab_bar.py, plus the ⚙ settings button
tab_bar_style custom
tab_powerline_style slanted
tab_bar_align left
tab_bar_margin_width 6
tab_bar_margin_height 6 4
tab_bar_min_tabs 1
tab_title_max_length 32
# Tab colors come from the theme (generated/theme.conf).
tab_title_template " {index} {title} "
active_tab_title_template " {index} {title} "
active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_show_new_tab_button yes
