# kitty — mesma aparência do Ptyxis (paleta "GNOME", fonte Adwaita Mono 11)
# com abas no topo no tema azul do Claude Code. Recarregar: ctrl+shift+F5.

# ---------- fonte ----------
font_family      Adwaita Mono
font_size        13.0
disable_ligatures never
# Linhas um pouco mais altas: deixa as abas (e o texto) com mais respiro
modify_font cell_height 115%

# ---------- cores: paleta GNOME (escura) do Ptyxis ----------
foreground            #ffffff
background            #1c1c1f
cursor                #ffffff
cursor_text_color     #1c1c1f
selection_foreground  #ffffff
selection_background  #3c6eb4
url_color             #51a1ff

color0  #241f31
color1  #c01c28
color2  #2ec27e
color3  #f5c211
color4  #1e78e4
color5  #9841bb
color6  #0ab9dc
color7  #c0bfbc
color8  #5e5c64
color9  #ed333b
color10 #57e389
color11 #f8e45c
color12 #51a1ff
color13 #c061cb
color14 #4fd2fd
color15 #f6f5f4

# ---------- janela ----------
window_padding_width 4 8
remember_window_size yes
# Fecha abas e janelas sem pedir confirmação
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0
# Barra de título do GNOME (arrastar com o mouse e botões de minimizar/maximizar/fechar),
# pintada com a cor do fundo para ficar discreta. Para escondê-la: hide_window_decorations yes
hide_window_decorations no
wayland_titlebar_color background
# Roda via XWayland para o GNOME desenhar a barra de título com os botões
# padrão do Fedora (Adwaita). Para voltar à barra própria do kitty: apague a linha.
linux_display_server x11

# ---------- rolagem ----------
scrollback_lines 20000
# ctrl+shift+h abre todo o histórico num leitor com busca
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 2.0

# ---------- abas ----------
# O estilo das abas fica em abas.conf (para testar estilos sem mexer aqui).
include abas.conf
bell_on_tab "● "

# ---------- abrir como estava ----------
# Ao abrir, o kitty reabre as abas da última vez (e retoma as conversas do Claude).
# O arquivo é atualizado sozinho por salvar_sessao.py enquanto você usa o kitty.
startup_session ultima-sessao.kitty-session
watcher salvar_sessao.py

# ---------- controle remoto ----------
# Permite que o painel do Claude Code troque de aba (só por socket, sem senha).
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# Integração com o zsh (pular entre prompts, abrir saída do último comando)
shell_integration enabled

# ---------- atalhos ----------
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+left previous_tab
map alt+right next_tab
map alt+t new_tab_with_cwd
map ctrl+shift+t new_tab_with_cwd
# Nova aba: Ctrl+N (o Ctrl+N deixa de chegar aos programas, ex.: "próximo" no histórico do zsh)
map ctrl+n new_tab_with_cwd
# Ctrl+W fecha a aba: na hora se tudo estiver parado; se algo estiver rodando,
# pede confirmação numa caixa própria (fechar_aba.py + fechar-aba-dialogo.sh).
# (Ctrl+W deixa de apagar a palavra anterior no zsh/Claude; use Alt+Backspace.)
map ctrl+w kitten fechar_aba.py
# Ctrl+Alt+W fecha só a sessão da frente (janela da pilha), com a mesma confirmação
map ctrl+alt+w kitten fechar_aba.py janela
# ---------- sessões do Claude ----------
# Ctrl+Alt+N: sessão nova na MESMA aba, empilhada (troque pelo painel lateral)
map ctrl+alt+n combine : goto_layout stack : launch --type=window --cwd=current sh -c 'exec "${SHELL:-/bin/bash}" -ic "$HOME/.local/bin/claude-painel"'
# Ctrl+Alt+T: sessão nova numa aba nova
map ctrl+alt+t launch --type=tab --cwd=current sh -c 'exec "${SHELL:-/bin/bash}" -ic "$HOME/.local/bin/claude-painel"'
# Alt+↑ / Alt+↓: sessão anterior / próxima dentro da mesma aba
map alt+up previous_window
map alt+down next_window
# Ctrl+Alt+Z: alterna entre pilha (uma por vez) e tela dividida
map ctrl+alt+z toggle_layout stack

# Divisões na pasta atual
map ctrl+shift+enter launch --cwd=current --location=vsplit
map ctrl+shift+minus launch --cwd=current --location=hsplit
enabled_layouts splits,stack
