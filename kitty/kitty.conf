# kitty — looks like Ptyxis (GNOME palette, Adwaita Mono font) by default,
# with tabs on top. Reload: ctrl+shift+F5.
#
# Everything you can change in the settings menu (ct config, ctrl+shift+f2 or
# the ⚙ in the tab bar) lives in generated/*.conf, written by that menu and
# included at the end of this file. This file holds only what is fixed.

# ---------- window ----------
remember_window_size yes
# Close tabs and windows without asking (the Ctrl+W kitten asks when needed)
confirm_os_window_close 0
visual_bell_duration 0
# Title bar painted with the background color to stay discreet
wayland_titlebar_color background
# Lets the transparency setting change without restarting kitty
dynamic_background_opacity yes

# ---------- scrollback ----------
# ctrl+shift+h opens the whole history in a pager with search
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 2.0

# ---------- tabs ----------
# The fixed part of the tab style lives in tabs.conf.
include tabs.conf
bell_on_tab "● "

# ---------- remote control ----------
# Lets the Claude Code panel switch tabs and the settings menu record
# shortcuts (socket only, no password).
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# zsh integration (jump between prompts, open the last command's output)
shell_integration enabled

# ---------- shortcuts ----------
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+left previous_tab
map alt+right next_tab
map alt+t new_tab_with_cwd
map ctrl+shift+t new_tab_with_cwd
# New tab: Ctrl+N (Ctrl+N no longer reaches programs, e.g. "next" in zsh history)
map ctrl+n new_tab_with_cwd
# Ctrl+W closes the tab: right away if everything is idle; if something is running,
# asks for confirmation in its own box (close_tab.py + close-tab-dialog.sh).
# (Ctrl+W no longer deletes the previous word in zsh/Claude; use Alt+Backspace.)
map ctrl+w kitten close_tab.py
# Ctrl+Alt+W closes only the front session (stacked window), with the same confirmation
map ctrl+alt+w kitten close_tab.py window
# ---------- Claude sessions ----------
# Ctrl+Alt+N: new session in the SAME tab, stacked (switch with the side panel)
map ctrl+alt+n combine : goto_layout stack : launch --type=window --cwd=current sh -c 'exec "${SHELL:-/bin/bash}" -ic "$HOME/.local/bin/claude-panel"'
# Ctrl+Alt+T: new session in a new tab
map ctrl+alt+t launch --type=tab --cwd=current sh -c 'exec "${SHELL:-/bin/bash}" -ic "$HOME/.local/bin/claude-panel"'
# Alt+↑ / Alt+↓: previous / next session within the same tab
map alt+up previous_window
map alt+down next_window
# Ctrl+Alt+Z: toggles between stack (one at a time) and split screen
map ctrl+alt+z toggle_layout stack

# Ctrl+Shift+F2: settings menu (language, theme, font) — same as `ct config` and the ⚙ in the tab bar
map ctrl+shift+f2 launch --type=overlay sh -c 'exec "$HOME/.local/bin/ct-config"'

# Splits in the current folder
map ctrl+shift+enter launch --cwd=current --location=vsplit
map ctrl+shift+minus launch --cwd=current --location=hsplit
enabled_layouts splits,stack

# ---------- settings from the menu ----------
include generated/theme.conf
include generated/font.conf
include generated/appearance.conf
include generated/behavior.conf
include generated/shortcuts.conf
