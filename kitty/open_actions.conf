# What kitty does when a link is opened (a click on a URL, or Ctrl+click through
# open_under_mouse.py). Linked to ~/.config/kitty/open_actions.conf by install.sh.
# Anything not matched here goes to the browser, as kitty does by default.

# file:// links (e.g. file:///home/me/project/src/main.rs#42): your editor, at that line
protocol file
fragment_matches [0-9]+
action launch --type=background sh -c 'exec "$HOME/.local/bin/ckt-open" --line "$1" "$2"' ckt-open ${FRAGMENT} ${FILE_PATH}

protocol file
action launch --type=background sh -c 'exec "$HOME/.local/bin/ckt-open" "$1"' ckt-open ${FILE_PATH}
