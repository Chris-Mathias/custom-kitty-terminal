# yazi (file manager) for custom-kitty-terminal, linked to ~/.config/yazi/yazi.toml
# by install.sh. Everything not set here keeps yazi's defaults.
#
# Text and code open in your editor through ckt-open (ct config → Behavior → Editor),
# images and the rest in the desktop's default app. Image previews show right in
# kitty (yazi draws them with kitty's graphics protocol).

[mgr]
show_hidden = false
sort_by = "natural"
sort_dir_first = true
linemode = "size"

[opener]
edit = [
  { run = 'ckt-open "$@"', desc = "Editor (ckt-open)", for = "unix" },
]
open = [
  { run = 'xdg-open "$1"', desc = "Open", orphan = true, for = "linux" },
]
